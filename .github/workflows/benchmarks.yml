---
name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Report-only performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            liveview_react_examples/assets/package-lock.json

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Install example Mix dependencies
        working-directory: liveview_react_examples
        run: mix deps.get

      - name: Install npm dependencies
        run: npm ci

      - name: Build library package
        run: npm run build

      - name: Install example asset dependencies
        working-directory: liveview_react_examples/assets
        run: npm ci

      - name: Build example client assets for lazy split measurement
        working-directory: liveview_react_examples/assets
        run: npm run build

      - name: Run Elixir benchmarks
        run: mix run bench/performance.exs 2>&1 | tee "$RUNNER_TEMP/elixir-benchmark.txt"

      - name: Run JavaScript benchmarks
        env:
          LIVEVIEW_REACT_REQUIRE_LAZY_SPLIT: "true"
        run: npm run benchmark 2>&1 | tee "$RUNNER_TEMP/javascript-benchmark.txt"

      - name: Write benchmark summary
        if: always()
        run: >-
          .github/scripts/write-benchmark-summary.sh
          "$RUNNER_TEMP/elixir-benchmark.txt"
          "$RUNNER_TEMP/javascript-benchmark.txt"
