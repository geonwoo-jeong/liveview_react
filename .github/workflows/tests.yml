---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  beam:
    name: >-
      BEAM ${{ matrix.profile }} /
      Elixir ${{ matrix.elixir }} /
      OTP ${{ matrix.otp }} /
      Phoenix ${{ matrix.phoenix_requirement }} /
      LiveView ${{ matrix.live_view_requirement }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            elixir: 1.20.0
            otp: 27.3.4.10
            phoenix_requirement: "== 1.8.0"
            live_view_requirement: "== 1.2.11"
          - profile: latest
            elixir: 1.20.4
            otp: 29.0.5
            phoenix_requirement: "~> 1.8"
            live_view_requirement: "~> 1.2.11"
    env:
      LIVEVIEW_REACT_CI_PHOENIX_REQUIREMENT: ${{ matrix.phoenix_requirement }}
      LIVEVIEW_REACT_CI_LIVE_VIEW_REQUIREMENT: ${{ matrix.live_view_requirement }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Unlock compatibility dependencies
        run: mix deps.unlock --all

      - name: Resolve ${{ matrix.profile }} compatibility dependencies
        run: mix deps.get

      - name: Audit retired Hex dependencies
        run: mix hex.audit

      - name: Restore Dialyzer PLT cache
        if: matrix.profile == 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/test/*.plt*
          key: dialyzer-${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile dependencies
        run: mix deps.compile

      - name: Audit vulnerable Mix dependencies
        run: mix deps.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --force --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run ExUnit
        run: mix test

      - name: Run Dialyzer
        if: matrix.profile == 'latest'
        run: mix dialyzer --format github

  javascript:
    name: >-
      JavaScript ${{ matrix.profile }} /
      Node ${{ matrix.node }} /
      React ${{ matrix.react }} /
      Types ${{ matrix.react_types }}/${{ matrix.react_dom_types }} /
      TypeScript ${{ matrix.typescript }} /
      Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            node: 24.20.0
            react: 19.0.0
            react_types: 19.0.14
            react_dom_types: 19.0.6
            typescript: 7.0.2
            vite: 8.0.0
          - profile: latest
            node: 26.8.1
            react: 19.2.8
            react_types: 19.2.18
            react_dom_types: 19.2.5
            typescript: 7.0.2
            vite: 8.2.2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve minimum JavaScript compatibility dependencies
        if: matrix.profile == 'minimum'
        run: >-
          npm install
          --no-save
          --package-lock=false
          --ignore-scripts
          --no-audit
          --no-fund
          react@19.0.0
          react-dom@19.0.0
          @types/react@19.0.14
          @types/react-dom@19.0.6
          typescript@7.0.2
          vite@8.0.0

      - name: Check formatting
        run: npm run format:check

      - name: Lint JavaScript sources
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run JavaScript unit, property, and stress tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm run pack:check

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  package:
    name: Hex and npm package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Install npm dependencies
        run: npm ci

      - name: Build npm package
        run: npm run build

      - name: Verify synchronized package versions
        run: |
          npm_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          mix_version="$(sed -nE 's/^  @version \"([^\"]+)\"$/\1/p' mix.exs)"
          test -n "$mix_version"
          test "$npm_version" = "$mix_version"

      - name: Check npm package artifact
        run: npm run pack:check

      - name: Check Hex package artifact
        run: mix hex.build --unpack --output "$RUNNER_TEMP/hex-package"

      - name: Build API documentation without warnings
        run: mix docs --warnings-as-errors --output "$RUNNER_TEMP/docs"

  example:
    name: Example / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.20.0
          - 26.8.1
    defaults:
      run:
        working-directory: liveview_react_examples
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            liveview_react_examples/assets/package-lock.json

      - name: Restore example Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            liveview_react_examples/deps
            liveview_react_examples/_build
          key: example-mix-${{ runner.os }}-otp-29.0.5-elixir-1.20.4-${{ hashFiles('liveview_react_examples/mix.lock') }}
          restore-keys: |
            example-mix-${{ runner.os }}-otp-29.0.5-elixir-1.20.4-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Audit retired example Hex dependencies
        if: matrix.node == '24.20.0'
        run: mix hex.audit

      - name: Check Mix formatting
        run: mix format --check-formatted

      - name: Compile example without warnings
        run: mix compile --force --warnings-as-errors

      - name: Run example tests
        run: mix test

      - name: Install library asset dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build library package for the example
        working-directory: ${{ github.workspace }}
        run: npm run build

      - name: Install asset dependencies
        working-directory: liveview_react_examples/assets
        run: npm ci

      - name: Audit example asset dependencies
        if: matrix.node == '24.20.0'
        working-directory: liveview_react_examples/assets
        run: npm audit --audit-level=high

      - name: Check asset types
        working-directory: liveview_react_examples/assets
        run: npm run typecheck

      - name: Build client assets
        working-directory: liveview_react_examples/assets
        run: npm run build

      - name: Build server assets
        working-directory: liveview_react_examples/assets
        run: npm run build-server

      - name: Check browser test types
        if: matrix.node == '24.20.0'
        working-directory: ${{ github.workspace }}
        run: npm run test:e2e:typecheck

      - name: Install Playwright Chromium
        if: matrix.node == '24.20.0'
        working-directory: ${{ github.workspace }}
        run: npx playwright install --with-deps chromium

      - name: Run real Phoenix browser E2E
        if: matrix.node == '24.20.0'
        working-directory: ${{ github.workspace }}
        run: npm run test:e2e
