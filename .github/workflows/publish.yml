---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: liveview-react-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dry-run:
    name: Package dry run
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIX_ENV: test
      NO_COLOR: "1"
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Run local release dry-run checks
        env:
          LIVEVIEW_REACT_DOCS_SOURCE_REF: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mix deps.get
          mix quality_full
          mix docs --warnings-as-errors --output "$RUNNER_TEMP/docs"
          mix run scripts/check_exdoc_links.exs "$RUNNER_TEMP/docs"
          npm ci
          npm run quality:ci
          mix hex.build --output "$RUNNER_TEMP/liveview_react.tar"

  browser-e2e:
    name: Example build and instrumented browser E2E
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIX_ENV: test
      NO_COLOR: "1"
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            liveview_react_examples/assets/package-lock.json

      - name: Install example BEAM dependencies
        working-directory: liveview_react_examples
        run: mix deps.get

      - name: Install and build the packed runtime source
        run: npm ci && npm run build

      - name: Install example asset dependencies
        working-directory: liveview_react_examples/assets
        run: npm ci

      - name: Check and build production example assets
        working-directory: liveview_react_examples/assets
        run: npm run typecheck && npm run build && npm run build-server

      - name: Check browser test types
        run: npm run test:e2e:typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run instrumented Phoenix browser E2E
        run: npm run test:e2e

  publish:
    name: Publish liveview_react
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, dry-run, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile Hex package
        run: mix compile --warnings-as-errors

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript sources
        run: npm run lint

      - name: Check JavaScript runtime types
        run: npm run typecheck

      - name: Test JavaScript runtime
        run: npm test

      - name: Build bundled JavaScript runtime
        run: npm run build

      - name: Verify release metadata and synchronized version
        env:
          LIVEVIEW_REACT_RELEASE_REPOSITORY: ${{ vars.LIVEVIEW_REACT_RELEASE_REPOSITORY }}
          RELEASE_PLEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_PLEASE_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_PLEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('.release-please-manifest.json','utf8'))['.']")"
          npm_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          lock_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package-lock.json','utf8')).version")"
          lock_root_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package-lock.json','utf8')).packages[''].version")"
          example_lock_version="$(node -p "JSON.parse(require('node:fs').readFileSync('liveview_react_examples/assets/package-lock.json','utf8')).packages['../..'].version")"
          mix_version="$(sed -nE 's/^  @version \"([^\"]+)\".*$/\1/p' mix.exs)"
          test -n "$mix_version"
          test "$manifest_version" = "$mix_version"
          test "$npm_version" = "$mix_version"
          test "$lock_version" = "$mix_version"
          test "$lock_root_version" = "$mix_version"
          test "$example_lock_version" = "$mix_version"
          test "$RELEASE_PLEASE_TAG_NAME" = "v${mix_version}"
          test "$RELEASE_PLEASE_VERSION" = "$mix_version"
          test "$(git rev-parse HEAD)" = "$RELEASE_PLEASE_SHA"
          test "$GITHUB_REPOSITORY" = "$LIVEVIEW_REACT_RELEASE_REPOSITORY"

      - name: Check Hex release state
        id: registry-state
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if mix hex.package fetch liveview_react "$package_version" --output "$RUNNER_TEMP/liveview_react-${package_version}.tar" >/dev/null 2>&1; then
            echo "hex_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "hex_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Hex package
        if: steps.registry-state.outputs.hex_exists != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          LIVEVIEW_REACT_DOCS_SOURCE_REF: ${{ needs.release-please.outputs.tag_name }}
        run: mix hex.publish --yes
