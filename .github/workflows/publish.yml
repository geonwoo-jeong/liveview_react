---
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish liveview_react to Hex and npm after all dry-run checks pass
        required: true
        type: boolean
        default: false
      confirmation:
        description: Type liveview_react after selecting the v<package-version> tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: liveview-react-release
  cancel-in-progress: false

jobs:
  dry-run:
    name: Package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Check Mix formatting
        run: mix format --check-formatted

      - name: Compile Hex package
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo

      - name: Run ExUnit
        run: mix test

      - name: Install npm dependencies
        run: npm ci

      - name: Check npm package types
        run: npm run typecheck

      - name: Test npm package
        run: npm test

      - name: Check npm package artifact
        run: npm run pack:check

      - name: Verify package identity and synchronized versions
        run: .github/scripts/check-package-identity.sh

      - name: Check Hex package contents
        run: .github/scripts/check-hex-package.sh

      - name: Check npm package
        run: npm publish --dry-run --access public

  publish:
    name: Publish liveview_react
    if: inputs.publish && inputs.confirmation == 'liveview_react'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile Hex package
        run: mix compile --warnings-as-errors

      - name: Install npm dependencies
        run: npm ci

      - name: Check npm package types
        run: npm run typecheck

      - name: Test npm package
        run: npm test

      - name: Build npm package
        run: npm run build

      - name: Verify package identity and synchronized versions
        env:
          LIVEVIEW_REACT_REQUIRE_VERSION_TAG: "true"
          LIVEVIEW_REACT_RELEASE_REPOSITORY: ${{ vars.LIVEVIEW_REACT_RELEASE_REPOSITORY }}
        run: .github/scripts/check-package-identity.sh

      - name: Check registry release state
        id: registry-state
        run: .github/scripts/check-release-state.sh

      - name: Publish Hex package
        if: steps.registry-state.outputs.hex_exists != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Publish npm package
        if: steps.registry-state.outputs.npm_exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
