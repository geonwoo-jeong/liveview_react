---
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish liveview_react to Hex after all dry-run checks pass
        required: true
        type: boolean
        default: false
      confirmation:
        description: Type liveview_react after selecting the v<package-version> tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: liveview-react-release
  cancel-in-progress: false

jobs:
  dry-run:
    name: Package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Run local release dry-run checks
        env:
          LIVEVIEW_REACT_DOCS_SOURCE_REF: ${{ github.sha }}
        run: |
          mix deps.get
          mix quality_full
          mix docs --warnings-as-errors --output "$RUNNER_TEMP/docs"
          mix run scripts/check_exdoc_links.exs "$RUNNER_TEMP/docs"
          npm ci
          npm run quality:ci
          mix hex.publish --dry-run --yes

  browser-e2e:
    name: Example build and instrumented browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            liveview_react_examples/assets/package-lock.json

      - name: Install example BEAM dependencies
        working-directory: liveview_react_examples
        run: mix deps.get

      - name: Install and build the packed runtime source
        run: npm ci && npm run build

      - name: Install example asset dependencies
        working-directory: liveview_react_examples/assets
        run: npm ci

      - name: Check and build production example assets
        working-directory: liveview_react_examples/assets
        run: npm run typecheck && npm run build && npm run build-server

      - name: Check browser test types
        run: npm run test:e2e:typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run instrumented Phoenix browser E2E
        run: npm run test:e2e

  publish:
    name: Publish liveview_react
    if: inputs.publish && inputs.confirmation == 'liveview_react'
    needs: [dry-run, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      ERL_COMPILER_OPTIONS: nowarn_deprecated_catch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.5
          disable_problem_matchers: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile Hex package
        run: mix compile --warnings-as-errors

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript sources
        run: npm run lint

      - name: Check JavaScript runtime types
        run: npm run typecheck

      - name: Test JavaScript runtime
        run: npm test

      - name: Build bundled JavaScript runtime
        run: npm run build

      - name: Verify release metadata and synchronized version
        env:
          LIVEVIEW_REACT_RELEASE_REPOSITORY: ${{ vars.LIVEVIEW_REACT_RELEASE_REPOSITORY }}
        run: |
          npm_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          mix_version="$(sed -nE 's/^  @version \"([^\"]+)\"$/\1/p' mix.exs)"
          expected_tag="refs/tags/v${npm_version}"
          test -n "$mix_version"
          test "$npm_version" = "$mix_version"
          test "$GITHUB_REF" = "$expected_tag"
          test "$GITHUB_REPOSITORY" = "$LIVEVIEW_REACT_RELEASE_REPOSITORY"

      - name: Check Hex release state
        id: registry-state
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if mix hex.package fetch liveview_react "$package_version" --output "$RUNNER_TEMP/liveview_react-${package_version}.tar" >/dev/null 2>&1; then
            echo "hex_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "hex_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Hex package
        if: steps.registry-state.outputs.hex_exists != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          LIVEVIEW_REACT_DOCS_SOURCE_REF: ${{ github.ref_name }}
        run: mix hex.publish --yes
